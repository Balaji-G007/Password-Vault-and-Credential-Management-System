<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaultkeep — Login Activities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1220;
    --surface: #161B2C;
    --surface-raised: #1C2238;
    --border: #2A3149;
    --border-soft: #232A40;
    --text: #E9E7E0;
    --text-muted: #8B92A8;
    --text-faint: #545C74;
    --accent: #C9A66B;
    --accent-dim: #9E8455;
    --teal: #4FD1C5;
    --error: #E2685B;
    --font-display: 'Sora', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .brand-mark { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  .brand-mark .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .back-link { color: var(--text-muted); text-decoration: none; font-size: 13.5px; border: 1px solid var(--border); padding: 7px 14px; border-radius: 7px; }
  .back-link:hover { border-color: var(--accent); color: var(--accent); }

  main { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
  .page-title { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .page-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

  .suspicious-banner {
    background: rgba(226, 104, 91, 0.1);
    border: 1px solid var(--error);
    color: var(--error);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 24px;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .suspicious-banner strong { color: var(--text); }

  .stats { display: flex; gap: 16px; margin-bottom: 28px; }
  .stat-card {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px;
  }
  .stat-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-value { font-family: var(--font-display); font-size: 30px; font-weight: 700; margin-top: 8px; }
  .success-value { color: var(--teal); }
  .failed-value { color: var(--error); }

  table {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; border-collapse: collapse;
  }
  th, td { text-align: left; padding: 12px 16px; font-size: 13.5px; }
  th {
    background: var(--surface-raised); color: var(--text-muted); font-weight: 600;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border);
  }
  td { border-bottom: 1px solid var(--border-soft); font-family: var(--font-mono); }
  tr:last-child td { border-bottom: none; }

  .badge { padding: 4px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600; font-family: var(--font-body); }
  .badge-success { background: rgba(79, 209, 197, 0.12); color: var(--teal); }
  .badge-failed { background: rgba(226, 104, 91, 0.12); color: var(--error); }
</style>
</head>
<body>

<header>
  <div class="brand-mark"><span class="dot"></span>VAULTKEEP</div>
  <a href="Dashboard.html" class="back-link">← Dashboard</a>
</header>

<main>
  <h1 class="page-title">🔒 Login Activities</h1>
  <p class="page-subtitle">Monitor and review your account login activity</p>

  <div id="suspiciousBanner" style="display:none;"></div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total Attempts</div>
      <div class="stat-value" id="totalAttempts">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Successful Logins</div>
      <div class="stat-value success-value" id="successCount">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Failed Attempts</div>
      <div class="stat-value failed-value" id="failedCount">-</div>
    </div>
  </div>

  <table>
    <thead>
      <tr><th>#</th><th>Email</th><th>Status</th><th>Date & Time</th></tr>
    </thead>
    <tbody id="logRows">
      <tr><td colspan="4">Loading…</td></tr>
    </tbody>
  </table>
</main>

<script>

const token = localStorage.getItem('vaultkeep_token');
if (!token) { window.location.href = 'Login.html'; }

fetch('http://localhost:8081/api/login-logs/me', {
  headers: { 'Authorization': 'Bearer ' + token }
})
.then(res => res.json())
.then(logs => {
  const total = logs.length;
  const successCount = logs.filter(l => l.success).length;
  const failedCount = total - successCount;

  document.getElementById('totalAttempts').textContent = total;
  document.getElementById('successCount').textContent = successCount;
  document.getElementById('failedCount').textContent = failedCount;

  // Check for suspicious activity on this account
  const currentUser = JSON.parse(localStorage.getItem('vaultkeep_user') || '{}');
  fetch('http://localhost:8081/api/security/suspicious-activity', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(res => res.json())
  .then(flags => {
    const myFlag = flags.find(f => f.email === currentUser.email);
    const banner = document.getElementById('suspiciousBanner');
    if (myFlag) {
      banner.style.display = 'flex';
      banner.className = 'suspicious-banner';
      banner.innerHTML = `⚠️ <span><strong>Suspicious activity detected:</strong> ${myFlag.failedAttempts} failed login attempts in the last ${myFlag.windowMinutes} minutes. If this wasn't you, consider changing your password.</span>`;
    }
  })
  .catch(err => console.error('Could not check suspicious activity', err));

  const rows = logs.map((log, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${log.email}</td>
      <td><span class="badge ${log.success ? 'badge-success' : 'badge-failed'}">${log.success ? '✓ SUCCESS' : '✗ FAILED'}</span></td>
      <td>${new Date(log.attemptedAt).toLocaleString()}</td>
    </tr>
  `).join('');

  document.getElementById('logRows').innerHTML = rows || '<tr><td colspan="4">No login activity yet.</td></tr>';
})
.catch(err => {
  document.getElementById('logRows').innerHTML = '<tr><td colspan="4">Failed to load login activity.</td></tr>';
  console.error(err);
});

</script>
</body>
</html>
