<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaultkeep — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1220;
    --surface: #161B2C;
    --surface-raised: #1C2238;
    --border: #2A3149;
    --border-soft: #232A40;
    --text: #E9E7E0;
    --text-muted: #8B92A8;
    --text-faint: #545C74;
    --accent: #C9A66B;
    --accent-dim: #9E8455;
    --teal: #4FD1C5;
    --error: #E2685B;
    --font-display: 'Sora', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .brand-mark {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-display); font-weight: 700; font-size: 18px;
  }
  .brand-mark .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .user-info { display: flex; align-items: center; gap: 16px; font-size: 13.5px; color: var(--text-muted); }
  .user-info a { color: var(--text-muted); text-decoration: none; }
  .user-info a:hover { color: var(--accent); }
  .logout-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    padding: 7px 14px; border-radius: 7px; font-size: 13px; cursor: pointer;
    font-family: var(--font-body);
  }
  .logout-btn:hover { border-color: var(--error); color: var(--error); }

  main { max-width: 560px; margin: 0 auto; padding: 40px 24px; }

  .page-title { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .page-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; margin-bottom: 20px;
  }
  .card h3 { font-family: var(--font-display); font-size: 15px; margin-bottom: 4px; }
  .card .card-sub { color: var(--text-muted); font-size: 12.5px; margin-bottom: 18px; }

  form { display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
  .field input {
    background: var(--surface-raised); border: 1px solid var(--border); border-radius: 7px;
    padding: 11px 12px; color: var(--text); font-family: var(--font-mono); font-size: 13.5px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .field input:disabled { opacity: 0.55; cursor: not-allowed; }

  .save-btn {
    background: var(--accent); color: #191307; border: none; border-radius: 7px;
    padding: 11px 0; font-weight: 600; font-size: 13.5px; cursor: pointer; align-self: flex-start;
    padding-left: 20px; padding-right: 20px;
  }
  .save-btn:hover { filter: brightness(1.08); }
  .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .form-error { color: var(--error); font-size: 12.5px; }
  .form-success { color: var(--teal); font-size: 12.5px; }

  .status-note {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 12px; color: var(--text-muted);
    background: var(--surface-raised); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 10px 12px; margin-top: 4px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <div class="brand-mark"><span class="dot"></span>VAULTKEEP</div>
  <div class="user-info">
    <span id="userGreeting">Loading…</span>
    <a href="Dashboard.html">Vault</a>
    <button class="logout-btn" id="logoutBtn">Log out</button>
  </div>
</header>

<main>
  <h1 class="page-title">Profile</h1>
  <p class="page-subtitle">Manage your account details.</p>

  <div class="card">
    <h3>Account information</h3>
    <p class="card-sub">Update your name or email address.</p>
    <form id="profileForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-error" id="profileError"></div>
      <div class="form-success" id="profileSuccess"></div>
      <button type="submit" class="save-btn" id="profileSaveBtn">Save changes</button>
    </form>
  </div>

  <div class="card">
    <h3>Master password</h3>
    <p class="card-sub">Changing your master password isn't available yet.</p>
    <div class="status-note">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span>This feature needs a backend endpoint (e.g. PUT /api/users/me/password) that isn't built yet.</span>
    </div>
  </div>
</main>

<script>
  const API_BASE = 'http://localhost:8081';
  const token = localStorage.getItem('vaultkeep_token');
  if (!token) {
    window.location.href = 'Login.html';
    throw new Error('Not logged in - redirecting.');
  }

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('vaultkeep_token');
    localStorage.removeItem('vaultkeep_user');
    window.location.href = 'Login.html';
  });

  // ---- Load current profile from the backend ----
  async function loadProfile() {
    try {
      const res = await fetch(`${API_BASE}/api/users/me`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Could not load profile.');
      const data = await res.json();

      document.getElementById('fullName').value = data.name;
      document.getElementById('email').value = data.email;
      document.getElementById('userGreeting').textContent = `${data.name} (${data.email})`;

      // Keep localStorage in sync with what the backend actually has
      localStorage.setItem('vaultkeep_user', JSON.stringify({ name: data.name, email: data.email }));
    } catch (err) {
      document.getElementById('profileError').textContent = 'Could not load your profile. Is the server running?';
    }
  }

  // ---- Save profile changes ----
  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const errorEl = document.getElementById('profileError');
    const successEl = document.getElementById('profileSuccess');
    const btn = document.getElementById('profileSaveBtn');

    errorEl.textContent = '';
    successEl.textContent = '';

    if (!name || !email) {
      errorEl.textContent = 'Name and email are required.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res = await fetch(`${API_BASE}/api/users/me`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ name, email })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Could not update profile.');

      localStorage.setItem('vaultkeep_user', JSON.stringify({ name: data.name, email: data.email }));
      document.getElementById('userGreeting').textContent = `${data.name} (${data.email})`;
      successEl.textContent = 'Profile updated.';
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save changes';
    }
  });

  loadProfile();
</script>

</body>
</html>
