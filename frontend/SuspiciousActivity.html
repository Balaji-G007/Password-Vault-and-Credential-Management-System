<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaultkeep — Suspicious Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1220; --surface: #161B2C; --surface-raised: #1C2238;
    --border: #2A3149; --border-soft: #232A40; --text: #E9E7E0;
    --text-muted: #8B92A8; --text-faint: #545C74; --accent: #C9A66B;
    --teal: #4FD1C5; --error: #E2685B;
    --font-display: 'Sora', sans-serif; --font-body: 'Inter', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .brand-mark { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  .brand-mark .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .back-link { color: var(--text-muted); text-decoration: none; font-size: 13.5px; border: 1px solid var(--border); padding: 7px 14px; border-radius: 7px; }
  .back-link:hover { border-color: var(--accent); color: var(--accent); }
  main { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
  .page-title { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .page-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }
  table { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; font-size: 13.5px; }
  th { background: var(--surface-raised); color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
  td { border-bottom: 1px solid var(--border-soft); font-family: var(--font-mono); }
  tr:last-child td { border-bottom: none; }
  .badge { padding: 4px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600; font-family: var(--font-body); background: rgba(226,104,91,0.12); color: var(--error); }
</style>
</head>
<body>
<header>
  <div class="brand-mark"><span class="dot"></span>VAULTKEEP</div>
  <a href="Dashboard.html" class="back-link">← Dashboard</a>
</header>
<main>
  <h1 class="page-title">🔍 Suspicious Activity</h1>
  <p class="page-subtitle">Unusual patterns detected on your account</p>
  <table>
    <thead><tr><th>Activity</th><th>Description</th><th>Detected</th><th>Status</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4">Loading…</td></tr></tbody>
  </table>
</main>
<script>
const token = localStorage.getItem('vaultkeep_token');
if (!token) window.location.href = 'Login.html';

fetch('http://localhost:8081/api/security/suspicious-activity', { headers: { 'Authorization': 'Bearer ' + token } })
.then(res => res.json())
.then(items => {
  const rows = document.getElementById('rows');
  if (!items.length) { rows.innerHTML = '<tr><td colspan="4">No suspicious activity detected.</td></tr>'; return; }
  rows.innerHTML = items.map(a => `
    <tr>
      <td><span class="badge">${a.activityType.replaceAll('_',' ')}</span></td>
      <td>${a.description}</td>
      <td>${new Date(a.detectedAt).toLocaleString()}</td>
      <td>${a.status}</td>
    </tr>
  `).join('');
})
.catch(() => document.getElementById('rows').innerHTML = '<tr><td colspan="4">Failed to load.</td></tr>');
</script>
</body>
</html>
