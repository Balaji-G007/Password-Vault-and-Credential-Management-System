<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaultkeep — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1220; --surface: #161B2C; --surface-raised: #1C2238;
    --border: #2A3149; --text: #E9E7E0; --text-muted: #8B92A8; --text-faint: #545C74;
    --accent: #C9A66B; --teal: #4FD1C5; --error: #E2685B;
    --font-display: 'Sora', sans-serif; --font-body: 'Inter', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 380px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin-bottom: 6px; }
  .subhead { color: var(--text-muted); font-size: 13.5px; margin-bottom: 26px; }
  form { display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
  .field input {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 13px; color: var(--text); font-family: var(--font-mono); font-size: 14px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }
  .field input.invalid { border-color: var(--error); }
  .error-msg { font-size: 12px; color: var(--error); min-height: 14px; font-family: var(--font-mono); }
  .success-msg { font-size: 12.5px; color: var(--teal); font-family: var(--font-mono); }
  .submit-btn {
    background: var(--accent); color: #191307; border: none; border-radius: 8px; padding: 13px 0;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .submit-btn:hover { filter: brightness(1.08); }
  .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .link { color: var(--accent); text-decoration: none; }
  .link:hover { text-decoration: underline; }
  .switch-line { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 22px; }
  .step { display: none; }
  .step.active { display: flex; flex-direction: column; gap: 16px; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Reset password</div>

  <!-- STEP 1: request OTP -->
  <div id="stepEmail" class="step active">
    <h2>Forgot your master password?</h2>
    <p class="subhead">Enter your account email and we'll send you a one-time code.</p>
    <form id="emailForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@domain.com" required>
      </div>
      <div class="error-msg" id="emailError"></div>
      <button type="submit" class="submit-btn" id="emailBtn">Send code</button>
    </form>
  </div>

  <!-- STEP 2: enter OTP + new password -->
  <div id="stepReset" class="step">
    <h2>Enter your code</h2>
    <p class="subhead" id="sentToText">We sent a 6-digit code to your email. It expires in 10 minutes.</p>
    <form id="resetForm">
      <div class="field">
        <label for="otp">Verification code</label>
        <input type="text" id="otp" placeholder="123456" maxlength="6" required>
      </div>
      <div class="field">
        <label for="newPassword">New master password</label>
        <input type="password" id="newPassword" placeholder="At least 6 characters" required>
      </div>
      <div class="error-msg" id="resetError"></div>
      <button type="submit" class="submit-btn" id="resetBtn">Reset password</button>
    </form>
    <p class="switch-line"><a href="#" class="link" id="resendLink">Resend code</a></p>
  </div>

  <div class="success-msg" id="successMsg" style="display:none; text-align:center; margin-top:16px;"></div>

  <p class="switch-line">Remembered it? <a href="Login.html" class="link">Sign in</a></p>
</div>

<script>
  const API_BASE = 'http://localhost:8081';
  let currentEmail = '';

  function showStep(stepId) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(stepId).classList.add('active');
  }

  // ---- Step 1: request OTP ----
  document.getElementById('emailForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const errorEl = document.getElementById('emailError');
    const btn = document.getElementById('emailBtn');
    errorEl.textContent = '';

    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Something went wrong.');

      currentEmail = email;
      document.getElementById('sentToText').textContent = `We sent a 6-digit code to ${email}. It expires in 10 minutes.`;
      showStep('stepReset');
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send code';
    }
  });

  // ---- Step 2: verify OTP + reset password ----
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const otp = document.getElementById('otp').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const errorEl = document.getElementById('resetError');
    const btn = document.getElementById('resetBtn');
    errorEl.textContent = '';

    if (newPassword.length < 6) {
      errorEl.textContent = 'Password must be at least 6 characters.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting…';

    try {
      const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail, otp, newPassword })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Could not reset password.');

      document.getElementById('stepReset').classList.remove('active');
      const successEl = document.getElementById('successMsg');
      successEl.style.display = 'block';
      successEl.textContent = 'Password reset! Redirecting to sign in…';
      setTimeout(() => window.location.href = 'Login.html', 1800);
    } catch (err) {
      errorEl.textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Reset password';
    }
  });

  // ---- Resend ----
  document.getElementById('resendLink').addEventListener('click', async (e) => {
    e.preventDefault();
    await fetch(`${API_BASE}/api/auth/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail })
    });
    alert('Code resent.');
  });
</script>

</body>
</html>
